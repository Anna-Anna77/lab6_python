{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <title>Архив статей</title>
</head>
    <body class="archive">
    <div class="header-top-links">
    <a href="{% url 'register' %}" class="top-link">Регистрация</a>
    </div>
    <div class="header">
        <a href="{% url 'create_post' %}" style="color: white; font-weight: bold; font-size: 20px;">+ Добавить статью</a>
        <img src="https://www.djangoproject.com/m/img/logos/django-logo-negative.png" alt="Логотип блога">
        <h1>Django public blog</h1>
    </div>
    <div class="archive">
        {% for post in posts %}
            <div class="one-post">
                <h2 class="post-title">
                    <a href="{% url 'get_article' article_id=post.id %}">{{ post.title }}</a>
                </h2>
                <div class="article-info">
                    <div class="article-author">{{ post.author.username }}</div>
                    <div class="article-created-date">{{ post.created_date }}</div>
                </div>
                <p class="article-text">{{ post.get_excerpt }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
