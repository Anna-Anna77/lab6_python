{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="header-top-links">
    <a href="{% url 'register' %}" class="top-link">Регистрация</a>
    </div>
    <div class="header">
        <img src="https://www.djangoproject.com/m/img/logos/django-logo-negative.png" alt="Логотип">
        <div class="back-link"><a href="/">Все статьи</a></div>
    </div>
    
    <div class="content">
        <h1>{{ post.title }}</h1>
        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <p class="article-text">{{ post.text }}</p>
    </div>
</body>
</html>
